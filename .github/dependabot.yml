version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "eslint", "@tanstack/eslint-config", "prettier*", "nitro"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
